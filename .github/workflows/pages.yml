# Build, test, and React-verify the widget suite on EVERY commit (pushes and
# PRs); deploy the static showcase to GitHub Pages only from green pushes to main
# AND only when the repository variable DEPLOY_GITHUB_PAGES is 'true'.
# Pages deploy requires: repo Settings → Pages → Source = "GitHub Actions".
# The packages live under packages/<name>/; qed64-showcase/ has its own pipeline.
name: suite-ci-and-showcase
on:
  push:
    branches: [main]
    paths-ignore: ['qed64-showcase/**']
  pull_request:
    paths-ignore: ['qed64-showcase/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache lake artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/.lake
            ~/.cache/mathlib
          key: lake-${{ runner.os }}-${{ hashFiles('packages/*/lakefile.toml', 'packages/*/lean-toolchain', 'packages/*/lake-manifest.json') }}

      - name: Fetch Mathlib caches
        run: |
          for p in interval-inspector graph-scope tree-scope hasse-view dist-lens; do
            (cd "packages/$p" && lake exe cache get)
          done

      - name: Build and test every package
        run: ./test-all.sh

      - name: Build the showcase (regenerates dumps from probes)
        run: ./showcase/build.sh

      - name: Headless React verification (fails on any React error/warning)
        run: node showcase/verify.mjs

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/site

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: showcase-preview
          path: showcase/site

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
